name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  BUILD_WORKFLOW: build.yml
  BUILD_BRANCH: master
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  PRERELEASE: ${{ contains(inputs.tag || github.ref_name, '-') }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # 发版说明取自 tag 指向的那次提交的 CHANGELOG，因此按 tag 检出而非按触发 ref
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # 程序与安装包的版本取自 LightBoard.csproj 的 Version，此处校验 tag 与之一致，
      # 避免发版版本与产物版本错位
      - name: Verify tag matches project version
        shell: bash
        run: |
          TOP=$(python3 .github/scripts/changelog.py version)
          if [ "$TOP" != "${RELEASE_TAG#v}" ]; then
            echo "::error::$RELEASE_TAG 与 LightBoard.csproj 的 Version $TOP 不一致：该 commit 构建出的程序与安装包版本为 $TOP"
            exit 1
          fi

      - name: Resolve build run for this commit
        id: build
        shell: bash
        run: |
          # 取 tag 指向的提交：workflow_dispatch 时 github.sha 是分支 HEAD，不是输入的 tag
          SHA=$(git rev-parse HEAD)

          INFO=$(gh run list --workflow "$BUILD_WORKFLOW" --commit "$SHA" --limit 1 \
            --json databaseId,conclusion --jq '.[0] // empty | "\(.databaseId)\t\(.conclusion // "pending")"')
          if [ -z "$INFO" ]; then
            echo "::error::$RELEASE_TAG ($SHA) 上没有 $BUILD_WORKFLOW 运行。请先把该 commit 推到 $BUILD_BRANCH 并等构建完成"
            exit 1
          fi

          RUN_ID=$(printf '%s' "$INFO" | cut -f1)
          CONCLUSION=$(printf '%s' "$INFO" | cut -f2)

          # 最新运行尚未结束则等它跑完（只等，不重建）
          if [ "$CONCLUSION" = "pending" ]; then
            gh run watch "$RUN_ID" --exit-status
          fi

          RUN=$(gh run list --workflow "$BUILD_WORKFLOW" --commit "$SHA" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN" ]; then
            echo "::error::$RELEASE_TAG ($SHA) 上没有成功的 $BUILD_WORKFLOW 运行，产物不可信，已中止发版"
            exit 1
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      # 逐个 --name 下载：--pattern 只命中一个产物时会直接解到 --dir，目录结构随命中数量变化
      # 八个产物都是构建的必备项，任一缺失即失败
      - name: Download artifacts
        run: |
          for name in \
            LightBoard LightBoard-nocv LightBoard-runtime LightBoard-nocv-runtime \
            LightBoard-installer LightBoard-installer-nocv LightBoard-installer-runtime LightBoard-installer-nocv-runtime; do
            gh run download "${{ steps.build.outputs.run }}" --name "$name" --dir "artifacts/$name"
          done

      # 免安装 zip 的文件名在发布时加入版本号；安装包的文件名在构建时已含版本号，直接复制。
      # 同一后缀组合下框架依赖与自包含的内部文件名相同，按产物名分目录打包
      - name: Package
        shell: bash
        run: |
          VERSION=${RELEASE_TAG#v}
          for name in LightBoard LightBoard-nocv LightBoard-runtime LightBoard-nocv-runtime; do
            ( cd "artifacts/$name" && zip -qr "$GITHUB_WORKSPACE/$name-$VERSION.zip" . )
          done
          for name in LightBoard-installer LightBoard-installer-nocv LightBoard-installer-runtime LightBoard-installer-nocv-runtime; do
            cp "artifacts/$name"/*.exe "$GITHUB_WORKSPACE/"
          done
          ls -l --block-size=K ./*.zip ./*.exe

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: python3 .github/scripts/changelog.py notes --tag "$RELEASE_TAG" --out release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            LightBoard-installer-*.exe
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          prerelease: ${{ env.PRERELEASE }}
