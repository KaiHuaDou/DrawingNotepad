name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  BUILD_WORKFLOW: build.yml
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  PRERELEASE: ${{ contains(inputs.tag || github.ref_name, '-') }}

jobs:
  release:
    runs-on: ubuntu-latest
    # 按需触发构建时，等待时间包含整个构建
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # 发版说明取自 tag 指向的那次提交的 CHANGELOG，因此按 tag 检出而非按触发 ref
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # 程序与安装包的版本取自 LightBoard.csproj 的 Version，此处校验 tag 与之一致，
      # 避免发版版本与产物版本错位
      - name: Verify tag matches project version
        shell: bash
        run: |
          TOP=$(python3 .github/scripts/changelog.py version)
          if [ "$TOP" != "${RELEASE_TAG#v}" ]; then
            echo "::error::$RELEASE_TAG 与 LightBoard.csproj 的 Version $TOP 不一致：该 commit 构建出的程序与安装包版本为 $TOP"
            exit 1
          fi

      # 本地打 tag 后立即 push 时构建可能尚未建立，缺失时按 tag 触发一次
      - name: Resolve build run for this commit
        id: build
        shell: bash
        run: python3 .github/scripts/resolve_build_run.py --workflow "$BUILD_WORKFLOW" --tag "$RELEASE_TAG"

      # 逐个 --name 下载：--pattern 只命中一个产物时会直接解到 --dir，目录结构随命中数量变化
      # 十六个产物都是构建的必备项，任一缺失即失败
      - name: Download artifacts
        run: |
          for name in \
            LightBoard-x64 LightBoard-nocv-x64 LightBoard-runtime-x64 LightBoard-nocv-runtime-x64 \
            LightBoard-arm64 LightBoard-nocv-arm64 LightBoard-runtime-arm64 LightBoard-nocv-runtime-arm64 \
            LightBoard-installer-x64 LightBoard-installer-nocv-x64 LightBoard-installer-runtime-x64 LightBoard-installer-nocv-runtime-x64 \
            LightBoard-installer-arm64 LightBoard-installer-nocv-arm64 LightBoard-installer-runtime-arm64 LightBoard-installer-nocv-runtime-arm64; do
            gh run download "${{ steps.build.outputs.run }}" --name "$name" --dir "artifacts/$name"
          done

      # 文件名在构建时已含版本与架构，这里只把各产物收进工作目录
      - name: Collect
        shell: bash
        run: |
          for name in \
            LightBoard-x64 LightBoard-nocv-x64 LightBoard-runtime-x64 LightBoard-nocv-runtime-x64 \
            LightBoard-arm64 LightBoard-nocv-arm64 LightBoard-runtime-arm64 LightBoard-nocv-runtime-arm64 \
            LightBoard-installer-x64 LightBoard-installer-nocv-x64 LightBoard-installer-runtime-x64 LightBoard-installer-nocv-runtime-x64 \
            LightBoard-installer-arm64 LightBoard-installer-nocv-arm64 LightBoard-installer-runtime-arm64 LightBoard-installer-nocv-runtime-arm64; do
            cp "artifacts/$name"/* "$GITHUB_WORKSPACE/"
          done
          ls -l --block-size=K ./*.zip ./*.exe

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: python3 .github/scripts/changelog.py notes --tag "$RELEASE_TAG" --out release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            LightBoard-installer-*.exe
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          prerelease: ${{ env.PRERELEASE }}
