name: Build

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Build
        run: dotnet test

  build:
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Build
        run: dotnet publish LightBoard -p:PublishProfile=FolderProfile -c Release

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard
          path: ./LightBoard/bin/publish/*

      - name: Build with Runtime
        run: dotnet publish LightBoard -p:PublishProfile=FolderProfile -c Release --self-contained

      - name: Upload with Runtime
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-with-runtime
          path: ./LightBoard/bin/publish/*
