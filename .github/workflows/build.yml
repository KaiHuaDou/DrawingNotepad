name: Build

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Build
        run: |
          dotnet publish -p:PublishProfile=FolderProfile

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard
          path: ./LightBoard/bin/publish/*

      - name: Build with Runtime
        run: |
          dotnet publish -p:PublishProfile=FolderProfile --self-contained

      - name: Upload with Runtime
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-with-runtime
          path: ./LightBoard/bin/publish/*
