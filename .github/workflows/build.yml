name: Build

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

  workflow_dispatch:

# 同一 ref 上的构建排队执行而不互相取消：发版会复用某个 commit 的产物，
# 取消会让该 commit 没有可信的构建结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from project
        id: version
        shell: bash
        run: |
          VERSION=$(python3 .github/scripts/changelog.py version)
          NUMERIC=$(python3 .github/scripts/changelog.py version --numeric)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"

  package:
    needs: [meta]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Test
        run: dotnet test

      - name: Publish
        shell: pwsh
        run: |
          $variants = @(
            @{ profile = 'FolderProfile'; extra = @() },
            @{ profile = 'FolderProfile'; extra = @('-p:WithOpenCv=false') },
            @{ profile = 'SelfContained'; extra = @() },
            @{ profile = 'SelfContained'; extra = @('-p:WithOpenCv=false') }
          )
          foreach ($variant in $variants) {
            dotnet publish LightBoard -p:PublishProfile=$($variant.profile) -c Release @($variant.extra)
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard
          path: ./LightBoard/bin/publish/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload app (no OpenCV)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-nocv
          path: ./LightBoard/bin/publish-nocv/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload app (runtime)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-runtime
          path: ./LightBoard/bin/publish-runtime/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload app (runtime, no OpenCV)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-nocv-runtime
          path: ./LightBoard/bin/publish-nocv-runtime/*
          retention-days: 30
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: ./.github/scripts/install-inno-setup.ps1

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
          APP_VERSION_NUMERIC: ${{ needs.meta.outputs.numeric }}
        run: |
          $variants = @(
            @{ out = 'LightBoard-installer';              extra = @() },
            @{ out = 'LightBoard-installer-nocv';         extra = @('-DNoOpenCv') },
            @{ out = 'LightBoard-installer-runtime';      extra = @('-DSelfContained') },
            @{ out = 'LightBoard-installer-nocv-runtime'; extra = @('-DNoOpenCv', '-DSelfContained') }
          )
          foreach ($variant in $variants) {
            $isccArgs = @($variant.extra) + @(
              "-DAppVersion=$env:APP_VERSION",
              "-DAppVersionNumeric=$env:APP_VERSION_NUMERIC",
              "--output-dir=LightBoard.Installer\Output\$($variant.out)",
              "LightBoard.Installer\LightBoard.iss"
            )
            & $env:ISCC @isccArgs
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-installer
          path: LightBoard.Installer/Output/LightBoard-installer/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload installer (no OpenCV)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-installer-nocv
          path: LightBoard.Installer/Output/LightBoard-installer-nocv/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload installer (runtime)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-installer-runtime
          path: LightBoard.Installer/Output/LightBoard-installer-runtime/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload installer (runtime, no OpenCV)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-installer-nocv-runtime
          path: LightBoard.Installer/Output/LightBoard-installer-nocv-runtime/*.exe
          retention-days: 30
          if-no-files-found: error
