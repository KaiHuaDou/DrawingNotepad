name: Build

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

  workflow_dispatch:

# 同一 ref 上的构建排队执行而不互相取消：发版会复用某个 commit 的产物，
# 取消会让该 commit 没有可信的构建结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from project
        id: version
        shell: bash
        run: |
          VERSION=$(python3 .github/scripts/changelog.py version)
          NUMERIC=$(python3 .github/scripts/changelog.py version --numeric)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.arch }})
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        # Arm64 使用 GitHub 托管的 Windows 11 Arm 运行器原生构建；
        # 测试只在 x64 上跑，Arm64 的测试另行安排
        include:
          - arch: x64
            runner: windows-latest
            folder: FolderProfile
            runtime: SelfContained
            suffix: "-x64"
            iscc: ""
            cache: "true"
          - arch: arm64
            runner: windows-11-arm
            folder: FolderProfileArm64
            runtime: SelfContainedArm64
            suffix: "-arm64"
            iscc: "-DArm64"
            cache: "false"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
          cache: ${{ matrix.cache }}
          cache-dependency-path: "**/*.csproj"

      - name: Test
        if: matrix.arch == 'x64'
        run: dotnet test

      - name: Publish
        shell: pwsh
        run: |
          $variants = @(
            @{ profile = '${{ matrix.folder }}'; extra = @() },
            @{ profile = '${{ matrix.folder }}'; extra = @('-p:WithOpenCv=false') },
            @{ profile = '${{ matrix.runtime }}'; extra = @() },
            @{ profile = '${{ matrix.runtime }}'; extra = @('-p:WithOpenCv=false') }
          )
          foreach ($variant in $variants) {
            dotnet publish LightBoard -p:PublishProfile=$($variant.profile) -c Release @($variant.extra)
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Package app
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $suffix = '${{ matrix.suffix }}'
          $dist = 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $variants = @(
            @{ dir = "publish$suffix";              name = "LightBoard$suffix" },
            @{ dir = "publish-nocv$suffix";         name = "LightBoard-nocv$suffix" },
            @{ dir = "publish-runtime$suffix";      name = "LightBoard-runtime$suffix" },
            @{ dir = "publish-nocv-runtime$suffix"; name = "LightBoard-nocv-runtime$suffix" }
          )
          foreach ($variant in $variants) {
            $source = "LightBoard/bin/$($variant.dir)"
            $target = "$dist/$($variant.name)-$env:APP_VERSION.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $source,
              $target,
              [System.IO.Compression.CompressionLevel]::Optimal,
              $false)
          }

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard${{ matrix.suffix }}
          path: ./dist/LightBoard${{ matrix.suffix }}-${{ needs.meta.outputs.version }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload app (no OpenCV)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-nocv${{ matrix.suffix }}
          path: ./dist/LightBoard-nocv${{ matrix.suffix }}-${{ needs.meta.outputs.version }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload app (runtime)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-runtime${{ matrix.suffix }}
          path: ./dist/LightBoard-runtime${{ matrix.suffix }}-${{ needs.meta.outputs.version }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload app (runtime, no OpenCV)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-nocv-runtime${{ matrix.suffix }}
          path: ./dist/LightBoard-nocv-runtime${{ matrix.suffix }}-${{ needs.meta.outputs.version }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: ./.github/scripts/install-inno-setup.ps1

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
          APP_VERSION_NUMERIC: ${{ needs.meta.outputs.numeric }}
          ISCC_DEFINE: ${{ matrix.iscc }}
        run: |
          $suffix = '${{ matrix.suffix }}'
          $variants = @(
            @{ out = "LightBoard-installer$suffix";              extra = @() },
            @{ out = "LightBoard-installer-nocv$suffix";         extra = @('-DNoOpenCv') },
            @{ out = "LightBoard-installer-runtime$suffix";      extra = @('-DSelfContained') },
            @{ out = "LightBoard-installer-nocv-runtime$suffix"; extra = @('-DNoOpenCv', '-DSelfContained') }
          )
          foreach ($variant in $variants) {
            $isccArgs = @($variant.extra)
            if ($env:ISCC_DEFINE) {
              $isccArgs += $env:ISCC_DEFINE
            }
            $isccArgs += @(
              "-DAppVersion=$env:APP_VERSION",
              "-DAppVersionNumeric=$env:APP_VERSION_NUMERIC",
              "--output-dir=LightBoard.Installer\Output\$($variant.out)",
              "LightBoard.Installer\LightBoard.iss"
            )
            & $env:ISCC @isccArgs
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-installer${{ matrix.suffix }}
          path: LightBoard.Installer/Output/LightBoard-installer${{ matrix.suffix }}/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload installer (no OpenCV)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-installer-nocv${{ matrix.suffix }}
          path: LightBoard.Installer/Output/LightBoard-installer-nocv${{ matrix.suffix }}/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload installer (runtime)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-installer-runtime${{ matrix.suffix }}
          path: LightBoard.Installer/Output/LightBoard-installer-runtime${{ matrix.suffix }}/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload installer (runtime, no OpenCV)
        uses: actions/upload-artifact@v7
        with:
          name: LightBoard-installer-nocv-runtime${{ matrix.suffix }}
          path: LightBoard.Installer/Output/LightBoard-installer-nocv-runtime${{ matrix.suffix }}/*.exe
          retention-days: 30
          if-no-files-found: error
