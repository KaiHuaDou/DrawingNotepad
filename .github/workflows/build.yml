name: Build

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

  workflow_dispatch:

# 同一 ref 上的构建排队执行而不互相取消：发版会复用某个 commit 的产物，
# 取消会让该 commit 没有可信的构建结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from CHANGELOG
        id: version
        shell: bash
        run: |
          VERSION=$(python3 .github/scripts/changelog.py version)
          NUMERIC=$(python3 .github/scripts/changelog.py version --numeric)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"

  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Test
        run: dotnet test

  # 两个变体各自一个作业：发布目录与安装包输出目录互不共享，单变体失败不影响另一个
  package:
    needs: [meta, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: LightBoard
            profile: FolderProfile
            publish_dir: bin/publish
            installer: LightBoard-installer
            self_contained: "false"
          - app: LightBoard-with-runtime
            profile: SelfContained
            publish_dir: bin/publish-with-runtime
            installer: LightBoard-installer-with-runtime
            self_contained: "true"
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Publish
        run: dotnet publish LightBoard -p:PublishProfile=${{ matrix.profile }} -c Release

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}
          path: ./LightBoard/${{ matrix.publish_dir }}/*
          # 发版要复用这里的产物，保留期需覆盖「构建完成后过一段时间才打 tag」
          retention-days: 30
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: ./.github/scripts/install-inno-setup.ps1

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
          APP_VERSION_NUMERIC: ${{ needs.meta.outputs.numeric }}
          SELF_CONTAINED: ${{ matrix.self_contained }}
        run: |
          $isccArgs = @(
            "-DAppVersion=$env:APP_VERSION",
            "-DAppVersionNumeric=$env:APP_VERSION_NUMERIC",
            "--output-dir=LightBoard.Installer\Output\${{ matrix.installer }}",
            "LightBoard.Installer\LightBoard.iss"
          )
          if ($env:SELF_CONTAINED -eq 'true') {
            $isccArgs = @('-DSelfContained') + $isccArgs
          }
          & $env:ISCC @isccArgs
          exit $LASTEXITCODE

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.installer }}
          path: LightBoard.Installer/Output/${{ matrix.installer }}/*.exe
          retention-days: 30
          if-no-files-found: error
